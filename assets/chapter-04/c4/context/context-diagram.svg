<rect x="975.0" y="582.0" width="240" height="40" fill="#ffffff" opacity="0.92"/>
<text x="1095.0" y="600.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#444444">Uses spatial reference</text>
<text x="60" y="950" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#777777">System Context view: only people and software systems directly related to the system of interest are shown.</text>
