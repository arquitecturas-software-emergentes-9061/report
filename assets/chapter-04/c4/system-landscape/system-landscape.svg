<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#707070"/>
  </marker>
</defs>
<rect width="1600" height="1000" fill="#ffffff"/>
<text x="60" y="55" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#222222">Software Architecture System Landscape Diagram</text>
<text x="60" y="86" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#666666">AR indoor navigation ecosystem for clinics and healthcare facilities</text>
<circle cx="240.0" cy="225" r="34" fill="#08427B" stroke="#08427B" stroke-width="3"/>
<rect x="128.0" y="265" width="224.0" height="78" rx="26" fill="#08427B" stroke="#08427B" stroke-width="3"/>
<text x="240.0" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Patient / Visitor</text>
<text x="240.0" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#e2e8f0">[Person]</text>
<text x="240.0" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#334155">Needs to locate services and</text>
<text x="240.0" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#334155">navigate inside the clinic.</text>
<circle cx="240.0" cy="645" r="34" fill="#08427B" stroke="#08427B" stroke-width="3"/>
<rect x="128.0" y="685" width="224.0" height="78" rx="26" fill="#08427B" stroke="#08427B" stroke-width="3"/>
<text x="240.0" y="715" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Clinic Operations Staff</text>
<text x="240.0" y="738" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#e2e8f0">[Person]</text>
<text x="240.0" y="792" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#334155">Maintains venue information and</text>
<text x="240.0" y="810" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#334155">supports patient orientation.</text>
<rect x="620" y="365" width="360" height="220" rx="8" fill="#1168BD" stroke="#1168BD" stroke-width="3"/>
<text x="800.0" y="432.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#ffffff">AR Indoor Navigation</text>
<text x="800.0" y="456.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Platform</text>
<text x="800.0" y="483.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#e2e8f0">[Software System]</text>
<text x="800.0" y="511.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#ffffff">Guides patients through the clinic using</text>
<text x="800.0" y="529.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#ffffff">indoor navigation and contextual AR</text>
<text x="800.0" y="547.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#ffffff">assistance.</text>
<rect x="1200" y="180" width="300" height="200" rx="8" fill="#999999" stroke="#999999" stroke-width="3"/>
<text x="1350.0" y="258.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Clinic Information Systems</text>
<text x="1350.0" y="285.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#e2e8f0">[Software System]</text>
<text x="1350.0" y="313.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#ffffff">Provides appointment, service, directory</text>
<text x="1350.0" y="331.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#ffffff">or destination information.</text>
<rect x="1200" y="600" width="300" height="200" rx="8" fill="#999999" stroke="#999999" stroke-width="3"/>
<text x="1350.0" y="666.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Spatial / Positioning</text>
<text x="1350.0" y="690.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Capability</text>
<text x="1350.0" y="717.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#e2e8f0">[Software System]</text>
<text x="1350.0" y="745.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#ffffff">Provides the spatial reference required</text>
<text x="1350.0" y="763.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#ffffff">for indoor navigation.</text>
<line x1="400" y1="300" x2="620" y2="435" stroke="#707070" stroke-width="2.4" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<rect x="390.0" y="331.5" width="240" height="56" fill="#ffffff" opacity="0.92"/>
<text x="510.0" y="349.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#444444">Uses to select a destination and</text>
<text x="510.0" y="365.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#444444">navigate</text>
<line x1="400" y1="700" x2="620" y2="505" stroke="#707070" stroke-width="2.4" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<rect x="390.0" y="566.5" width="240" height="56" fill="#ffffff" opacity="0.92"/>
<text x="510.0" y="584.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#444444">Configures venue information and</text>
<text x="510.0" y="600.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#444444">reviews navigation insights</text>
<line x1="980" y1="430" x2="1200" y2="280" stroke="#707070" stroke-width="2.4" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<rect x="970.0" y="319.0" width="240" height="56" fill="#ffffff" opacity="0.92"/>
<text x="1090.0" y="337.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#444444">Optionally obtains appointment,</text>
<text x="1090.0" y="353.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#444444">service and destination data</text>
<line x1="980" y1="500" x2="1200" y2="700" stroke="#707070" stroke-width="2.4" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<rect x="970.0" y="564.0" width="240" height="56" fill="#ffffff" opacity="0.92"/>
<text x="1090.0" y="582.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#444444">Uses spatial reference for indoor</text>
<text x="1090.0" y="598.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#444444">navigation</text>
<text x="60" y="950" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#777777">Notation aligned to C4 Model and Structurizr DSL view semantics.</text>
</svg>