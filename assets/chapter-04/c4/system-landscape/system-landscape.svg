<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .boxTitle { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 400 16px Arial, sans-serif; fill: #334155; }
      .person { fill: #f8fafc; stroke: #475569; stroke-width: 2; rx: 18; }
      .system { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; rx: 18; }
      .external { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; rx: 18; }
      .relation { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 10 8; }
      .label { font: 600 15px Arial, sans-serif; fill: #334155; }
      .note { font: italic 14px Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="55" text-anchor="middle" class="title">Software Architecture System Landscape</text>
  <text x="700" y="88" text-anchor="middle" class="subtitle">AR indoor navigation ecosystem for clinics and healthcare facilities</text>

  <rect x="80" y="190" width="300" height="150" class="person"/>
  <text x="230" y="230" text-anchor="middle" class="boxTitle">Patient / Visitor</text>
  <text x="230" y="262" text-anchor="middle" class="boxText">Needs to locate services,</text>
  <text x="230" y="287" text-anchor="middle" class="boxText">navigate the clinic and complete</text>
  <text x="230" y="312" text-anchor="middle" class="boxText">steps of the care journey.</text>

  <rect x="80" y="550" width="300" height="150" class="person"/>
  <text x="230" y="590" text-anchor="middle" class="boxTitle">Clinic Operations Staff</text>
  <text x="230" y="622" text-anchor="middle" class="boxText">Maintains destinations, routes,</text>
  <text x="230" y="647" text-anchor="middle" class="boxText">venue information and reviews</text>
  <text x="230" y="672" text-anchor="middle" class="boxText">navigation insights.</text>

  <rect x="515" y="315" width="370" height="220" class="system"/>
  <text x="700" y="365" text-anchor="middle" class="boxTitle">AR Indoor Navigation Platform</text>
  <text x="700" y="402" text-anchor="middle" class="boxText">Software system developed by the team</text>
  <text x="700" y="432" text-anchor="middle" class="boxText">to configure indoor spaces and guide</text>
  <text x="700" y="462" text-anchor="middle" class="boxText">patients with contextual indoor navigation</text>
  <text x="700" y="492" text-anchor="middle" class="boxText">and augmented-reality assistance.</text>

  <rect x="1030" y="190" width="300" height="150" class="external"/>
  <text x="1180" y="230" text-anchor="middle" class="boxTitle">Clinic Information Systems</text>
  <text x="1180" y="262" text-anchor="middle" class="boxText">Appointment, directory or service</text>
  <text x="1180" y="287" text-anchor="middle" class="boxText">information that may be integrated</text>
  <text x="1180" y="312" text-anchor="middle" class="boxText">as the solution evolves.</text>

  <rect x="1030" y="550" width="300" height="150" class="external"/>
  <text x="1180" y="590" text-anchor="middle" class="boxTitle">Spatial / Positioning Capability</text>
  <text x="1180" y="622" text-anchor="middle" class="boxText">Indoor positioning or spatial anchoring</text>
  <text x="1180" y="647" text-anchor="middle" class="boxText">capability required by navigation.</text>
  <text x="1180" y="672" text-anchor="middle" class="boxText">Concrete technology remains to be selected.</text>

  <path d="M380 265 C455 265, 455 370, 515 390" class="relation"/>
  <text x="442" y="303" text-anchor="middle" class="label">uses navigation</text>

  <path d="M380 625 C455 625, 455 500, 515 475" class="relation"/>
  <text x="447" y="583" text-anchor="middle" class="label">configures venue</text>

  <path d="M885 390 C950 360, 980 300, 1030 275" class="relation dashed"/>
  <text x="963" y="326" text-anchor="middle" class="label">future integration</text>

  <path d="M885 475 C950 505, 980 575, 1030 615" class="relation"/>
  <text x="969" y="553" text-anchor="middle" class="label">obtains spatial reference</text>

  <text x="700" y="815" text-anchor="middle" class="note">Strategic view: external technologies and clinic integrations are intentionally vendor-neutral until architectural decisions are finalized.</text>
</svg>
